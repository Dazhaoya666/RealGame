<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>屏幕数字识别器</title>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #e0e0e0;
    min-height: 100vh;
    padding: 30px 20px;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
    color: #00ffaa;
    font-weight: 500;
    letter-spacing: 1px;
  }
  .subtitle {
    color: #888;
    margin-bottom: 30px;
    font-size: 14px;
  }
  .panel {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(0, 255, 170, 0.15);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 16px;
    margin-bottom: 15px;
    color: #00ffaa;
    font-weight: 500;
  }
  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 12px;
  }
  .row:last-child { margin-bottom: 0; }
  label {
    font-size: 13px;
    color: #aaa;
    min-width: 80px;
  }
  input[type="number"], input[type="text"] {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(0, 255, 170, 0.2);
    color: #e0e0e0;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    width: 100px;
    outline: none;
  }
  input[type="number"]:focus, input[type="text"]:focus {
    border-color: #00ffaa;
  }
  button {
    background: #00ffaa;
    color: #1a1a2e;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover {
    background: #00e695;
    transform: translateY(-1px);
  }
  button:disabled {
    background: #555;
    cursor: not-allowed;
    transform: none;
  }
  button.secondary {
    background: transparent;
    color: #00ffaa;
    border: 1px solid #00ffaa;
  }
  button.secondary:hover { background: rgba(0, 255, 170, 0.1); }
  button.danger {
    background: transparent;
    color: #ff6b6b;
    border: 1px solid #ff6b6b;
  }
  button.danger:hover { background: rgba(255, 107, 107, 0.1); }
  .status {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    margin-left: 10px;
  }
  .status.idle { background: #444; color: #ccc; }
  .status.active { background: #00ffaa; color: #1a1a2e; }
  .status.error { background: #ff6b6b; color: white; }
  .current-number {
    font-size: 48px;
    color: #00ffaa;
    text-align: center;
    padding: 20px;
    font-weight: 300;
    letter-spacing: 2px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 0 30px rgba(0, 255, 170, 0.3);
  }
  .current-number.none {
    color: #555;
    font-size: 16px;
    text-shadow: none;
  }
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }
  .list-count {
    font-size: 13px;
    color: #888;
  }
  .list-count b {
    color: #00ffaa;
    font-size: 16px;
    margin: 0 4px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  th {
    color: #00ffaa;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: rgba(0, 255, 170, 0.05);
  }
  td { color: #ccc; }
  tr:hover { background: rgba(0, 255, 170, 0.03); }
  .idx { color: #666; width: 50px; }
  .num {
    color: #00ffaa;
    font-family: monospace;
    font-size: 16px;
    font-weight: 500;
  }
  .del-btn {
    background: transparent;
    border: 1px solid #ff6b6b;
    color: #ff6b6b;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 4px;
  }
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #666;
    font-size: 14px;
  }
  .hint {
    font-size: 12px;
    color: #666;
    margin-top: 10px;
    line-height: 1.6;
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .scroll-table {
    max-height: 400px;
    overflow-y: auto;
  }
  .scroll-table::-webkit-scrollbar { width: 6px; }
  .scroll-table::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
  .scroll-table::-webkit-scrollbar-thumb { background: rgba(0,255,170,0.3); border-radius: 3px; }
  .progress {
    font-size: 12px;
    color: #888;
    margin-left: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>屏幕数字识别器</h1>
  <p class="subtitle">实时扫描屏幕，识别数字并存入清单</p>

  <div class="panel">
    <h2>1. 识别设置</h2>
    <div class="row">
      <label>最小值</label>
      <input type="number" id="minVal" value="0.1" step="0.001">
      <label>最大值</label>
      <input type="number" id="maxVal" value="1.6" step="0.001">
      <label>小数位数</label>
      <input type="number" id="decimals" value="3" min="0" max="6">
    </div>
    <div class="row">
      <label>采样间隔</label>
      <input type="number" id="interval" value="1" step="0.5" min="0.3"> 秒
    </div>
    <div class="hint">提示：小数位数为 0 时识别整数；识别到的数字超出范围将被忽略。</div>
  </div>

  <div class="panel">
    <h2>2. 启动识别</h2>
    <div class="row">
      <div class="actions">
        <button id="startBtn">开始扫描屏幕</button>
        <button id="stopBtn" class="secondary" disabled>停止</button>
      </div>
      <span id="status" class="status idle">空闲</span>
      <span id="progress" class="progress"></span>
    </div>
    <div class="current-number none" id="currentNum">尚未识别</div>
    <div class="hint">
      点击「开始扫描屏幕」后，浏览器会弹出选择窗口，选择要识别的屏幕/窗口即可。<br>
      建议选择仅显示随机数字的那个窗口或标签页，识别准确率最高。
    </div>
  </div>

  <div class="panel">
    <h2>3. 识别清单</h2>
    <div class="list-header">
      <div class="list-count">共 <b id="count">0</b> 条记录</div>
      <div class="actions">
        <button id="exportBtn" class="secondary">导出 CSV</button>
        <button id="clearBtn" class="danger">清空</button>
      </div>
    </div>
    <div class="scroll-table">
      <table>
        <thead>
          <tr><th class="idx">#</th><th>数字</th><th>识别时间</th><th>操作</th></tr>
        </thead>
        <tbody id="listBody">
          <tr><td colspan="4" class="empty">暂无数据</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progress');
const currentNumEl = document.getElementById('currentNum');
const listBody = document.getElementById('listBody');
const countEl = document.getElementById('count');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let stream = null;
let videoElement = null;
let timer = null;
let ocrWorker = null;
let records = JSON.parse(localStorage.getItem('ocr_records') || '[]');
let lastNumber = null;

function renderList() {
  if (records.length === 0) {
    listBody.innerHTML = '<tr><td colspan="4" class="empty">暂无数据</td></tr>';
  } else {
    listBody.innerHTML = records.map((r, i) => `
      <tr>
        <td class="idx">${i + 1}</td>
        <td class="num">${r.number}</td>
        <td>${r.time}</td>
        <td><button class="del-btn" data-idx="${i}">删除</button></td>
      </tr>
    `).join('');
    listBody.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(e.target.dataset.idx);
        records.splice(idx, 1);
        localStorage.setItem('ocr_records', JSON.stringify(records));
        renderList();
      });
    });
  }
  countEl.textContent = records.length;
}

function setStatus(text, type) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + type;
}

async function initOCR() {
  if (!ocrWorker) {
    setStatus('加载识别引擎...', 'active');
    ocrWorker = await Tesseract.createWorker('eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          progressEl.textContent = `OCR ${Math.round(m.progress * 100)}%`;
        }
      }
    });
    progressEl.textContent = '';
  }
}

async function startCapture() {
  try {
    await initOCR();
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 5 }
    });
    videoElement = document.createElement('video');
    videoElement.srcObject = stream;
    videoElement.play();

    stream.getVideoTracks()[0].onended = () => stopCapture();

    const interval = parseFloat(document.getElementById('interval').value) * 1000;
    timer = setInterval(captureAndRecognize, interval);
    setStatus('识别中', 'active');
    startBtn.disabled = true;
    stopBtn.disabled = false;
  } catch (err) {
    console.error(err);
    setStatus('启动失败：' + (err.message || err), 'error');
  }
}

function stopCapture() {
  if (timer) { clearInterval(timer); timer = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  videoElement = null;
  setStatus('已停止', 'idle');
  startBtn.disabled = false;
  stopBtn.disabled = true;
  progressEl.textContent = '';
}

async function captureAndRecognize() {
  if (!videoElement || !videoElement.videoWidth) return;

  canvas.width = videoElement.videoWidth;
  canvas.height = videoElement.videoHeight;
  ctx.drawImage(videoElement, 0, 0);

  try {
    const { data: { text } } = await ocrWorker.recognize(canvas);
    const num = extractNumber(text);
    if (num !== null) {
      currentNumEl.classList.remove('none');
      currentNumEl.textContent = num.formatted;

      const timeStr = new Date().toLocaleString('zh-CN');
      records.push({ number: num.formatted, time: timeStr, raw: num.value });
      if (records.length > 500) records = records.slice(-500);
      localStorage.setItem('ocr_records', JSON.stringify(records));
      renderList();
    }
  } catch (e) {
    console.warn('识别错误:', e);
  }
}

function extractNumber(text) {
  const min = parseFloat(document.getElementById('minVal').value);
  const max = parseFloat(document.getElementById('maxVal').value);
  const decimals = parseInt(document.getElementById('decimals').value);

  if (decimals === 0) {
    const matches = text.match(/\b\d+\b/g);
    if (!matches) return null;
    for (const m of matches) {
      const n = parseFloat(m);
      if (n >= min && n <= max) return { value: n, formatted: n.toString() };
    }
  } else {
    const regex = new RegExp(`\\b\\d+\\.\\d{1,${decimals}}\\b`, 'g');
    const matches = text.match(regex);
    if (!matches) return null;
    for (const m of matches) {
      const n = parseFloat(m);
      if (n >= min && n <= max) {
        const formatted = n.toFixed(decimals);
        return { value: n, formatted };
      }
    }
  }
  return null;
}

startBtn.addEventListener('click', startCapture);
stopBtn.addEventListener('click', stopCapture);

document.getElementById('clearBtn').addEventListener('click', () => {
  if (records.length === 0) return;
  if (confirm('确定清空所有识别记录吗？')) {
    records = [];
    localStorage.removeItem('ocr_records');
    renderList();
  }
});

document.getElementById('exportBtn').addEventListener('click', () => {
  if (records.length === 0) {
    alert('没有数据可导出');
    return;
  }
  let csv = '序号,数字,识别时间\n';
  records.forEach((r, i) => {
    csv += `${i + 1},${r.number},"${r.time}"\n`;
  });
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `识别记录_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

renderList();
</script>
</body>
</html>
